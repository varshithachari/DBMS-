version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. DATABASE: PostgreSQL Persistent Relational Store
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: chanakya_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chanakya_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chanakya_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-chanakya_campus}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./datasets/seed_data.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chanakya_admin} -d ${POSTGRES_DB:-chanakya_campus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. MESSAGE BROKER: RabbitMQ Event Broker for Architecture B
  # -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: chanakya_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 3. ARCHITECTURE A: Modular Monolith Service (Port 8001)
  # -------------------------------------------------------------
  backend-monolith:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: chanakya_monolith
    restart: unless-stopped
    environment:
      PORT: 8001
      DATABASE_URL: postgresql://${POSTGRES_USER:-chanakya_admin}:${POSTGRES_PASSWORD:-chanakya_secure_pass}@postgres:5432/${POSTGRES_DB:-chanakya_campus}
    ports:
      - "8001:8001"
    command: ["uvicorn", "backend.modular_monolith.app:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------
  # 4. ARCHITECTURE B: Event-Driven Architecture Service (Port 8002)
  # -------------------------------------------------------------
  backend-event-driven:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: chanakya_event_driven
    restart: unless-stopped
    environment:
      PORT: 8002
      DATABASE_URL: postgresql://${POSTGRES_USER:-chanakya_admin}:${POSTGRES_PASSWORD:-chanakya_secure_pass}@postgres:5432/${POSTGRES_DB:-chanakya_campus}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
    ports:
      - "8002:8002"
    command: ["uvicorn", "backend.event_driven.app:app", "--host", "0.0.0.0", "--port", "8002"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # -------------------------------------------------------------
  # 5. UNIFIED WEB APPLICATION & REVERSE PROXY GATEWAY (Port 3000)
  # -------------------------------------------------------------
  web-portal:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: chanakya_web_portal
    restart: unless-stopped
    environment:
      PORT: 3000
      MONOLITH_URL: http://backend-monolith:8001
      EVENT_DRIVEN_URL: http://backend-event-driven:8002
    ports:
      - "3000:3000"
    depends_on:
      - backend-monolith
      - backend-event-driven

  # -------------------------------------------------------------
  # 6. OBSERVABILITY: Prometheus Metrics Scraper
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: chanakya_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend-monolith
      - backend-event-driven

  # -------------------------------------------------------------
  # 7. OBSERVABILITY: Grafana Dashboards
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.0.3
    container_name: chanakya_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus

volumes:
  pgdata:
  rabbitmq_data:
  grafana_data:
